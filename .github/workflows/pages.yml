
name: Build and Deploy Pong GS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare game files
        run: |
          mkdir -p public
          cp game.love public/game.love

          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="uk">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Pong GS</title>
            <style>
              html, body {
                margin: 0;
                width: 100%;
                height: 100%;
                background: #111;
                color: white;
                font-family: Arial, sans-serif;
              }
              body {
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
              }
              canvas {
                max-width: 100%;
                max-height: 85vh;
              }
            </style>
          </head>
          <body>
            <h2>Pong GS</h2>
            <p>Завантаження гри...</p>
            <script src="https://cdn.jsdelivr.net/npm/love.js@11.3.0/dist/love.js"></script>
            <script>
              Love({
                file: "game.love",
                arguments: [],
                canvas: document.getElementById("game")
              });
            </script>
            <canvas id="game"></canvas>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
