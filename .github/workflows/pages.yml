name: Build and Deploy Lua Game

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Create LÖVE game archive
        run: |
          rm -rf game game.love web
          mkdir game

          cp main.lua game/
          cp conf.lua game/

          cd game
          zip -r ../game.love .
          cd ..

          echo "Game archive created:"
          ls -lh game.love

      - name: Install love.js
        run: |
          npm install love.js

      - name: Build Lua game for web
        run: |
          echo "Building LÖVE game for GitHub Pages..."

          npx love.js -c -t "Pong-GS" game.love web

          echo "Build completed."
          echo "Web files:"
          ls -la web

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./web

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
